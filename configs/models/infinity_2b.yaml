# Infinity-2B — model identity, weight paths, and runtime block.
#
# Loaded by compose_generation_config when mi_model_type=infinity_2b (set at
# the pipeline level in configs/pipeline/run_pipeline.yaml — no longer declared
# here). Used by generation, detection, *and* finetuning (for model.* paths).
#
# The top-level `infinity:` block carries the architecture/runtime config the
# Infinity generator needs (T5, VAE, sampling). It lives here — not under
# watermark.params — so it does not pollute the watermark identity slug used
# by src/paths.py:resolve_wm_params.

# Finetuning hyperparameter base merged under the run config. Inference-only
# usage works too — load_finetune_config still composes this file, and
# training keys are simply ignored when no training runs.
finetune_base: configs/finetuning/infinity/infinity_2b.yaml

model:
  model_path: ${oc.env:RADIOACTIVITY_MODELS}/models/Infinity/weights/infinity_2b_reg.pth
  # InfinityRunner reads model.pretrained_model_name_or_path for --rush_resume.
  pretrained_model_name_or_path: ${oc.env:RADIOACTIVITY_MODELS}/models/Infinity/weights/infinity_2b_reg.pth

infinity:
  architecture: infinity
  model_type: infinity_2b
  model_path: ${oc.env:RADIOACTIVITY_MODELS}/models/Infinity/weights/infinity_2b_reg.pth
  vae_path: ${oc.env:RADIOACTIVITY_MODELS}/models/Infinity/weights/infinity_vae_d32reg.pth
  text_encoder_ckpt: ${oc.env:RADIOACTIVITY_MODELS}/models/Infinity/flan-t5-xl
  t5_path: ${oc.env:RADIOACTIVITY_MODELS}/models/Infinity/flan-t5-xl
  pn: "1M"
  cfg: "3"
  tau: 0.5
  cfg_insertion_layer: 0
  vae_type: 32
  sampling_per_bits: 1
  add_lvl_embeding_only_first_block: 1
  apply_spatial_patchify: 0
  rope2d_each_sa_layer: 1
  rope2d_normalized_by_hw: 2
  use_scale_schedule_embedding: 0
  use_flex_attn: 0
  text_channels: 2048
  checkpoint_type: torch
  enable_model_cache: 0
  bf16: 1
  seed: 0
  enable_positive_prompt: 0
  decode_per_scale: false
  cache_dir: /dev/shm

datasets:
  name: coco

dataset_params:
  num_images: 5000

# BitMark-style defaults so the Infinity runner can boot for non-bitmark
# watermarks (e.g. post-gen rivagan/stegastamp/trustmark on infinity_2b).
# delta=0 makes this a no-op; bitmark.yaml overrides delta when active.
watermark:
  params:
    use_bit_label: 1
    watermark_delta: 0
    watermark_scales: 2
    watermark_method: "2-bit_pattern"
    set: "01,10"
    watermark_context_width: 2
    watermark_gen_image: 0
    watermark_count_bit_loss_after_reencoding: 1
    watermark_count_bit_flip: 1
    watermark_remove_duplicates: 0
    watermark_add_noise: 0
